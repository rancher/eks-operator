name: Nightly
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  publish_nightly:
    uses: rancher-sandbox/hosted-providers-reusable-workflows/.github/workflows/operator-with-latest-rancher-build.yaml@db73b8b138c3602843ee0b0ec58fd4f36484ff6a # main
    with:
      operator_name: eks-operator
      operator_commit: ${{ github.sha }}

  publish_images:
    permissions:
      packages: write # Required for pushing images to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Set image tag
        run: echo "TAG=v0.0.0-$(date +'%Y%m%d')" >> "$GITHUB_ENV"
      - name: Build and push image
        env:
          REPO: ghcr.io/rancher
        run: |
          make image-push

  publish_charts:
    permissions:
      packages: write # Required for pushing charts to ghcr.io
    runs-on: ubuntu-latest
    needs: publish_images
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GHCR registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.21.3
      - name: Set image tag and chart version
        run: |
          echo "TAG=v0.0.0-$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "CHART_VERSION=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
      - name: Build charts
        env:
          REPO: ghcr.io/rancher # used in the Helm chart values.yaml
        run: |
          make charts
      - name: Push charts
        run: |
          helm push bin/rancher-eks-operator-$CHART_VERSION.tgz oci://ghcr.io/${{ github.repository_owner }}/rancher-eks-operator-chart
          helm push bin/rancher-eks-operator-crd-$CHART_VERSION.tgz oci://ghcr.io/${{ github.repository_owner }}/rancher-eks-operator-crd-chart
